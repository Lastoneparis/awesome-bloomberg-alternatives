name: Critical Strike

on:
  push:
    paths:
      - 'CriticalStrike/**'
      - '.github/workflows/criticalstrike.yml'
  pull_request:
    paths:
      - 'CriticalStrike/**'
      - '.github/workflows/criticalstrike.yml'

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Swift sources
        run: python3 CriticalStrike/Tools/validate.py
      - name: Resolve cross-file symbols
        run: python3 CriticalStrike/Tools/symbolcheck.py
      - name: Check initializer argument order
        run: python3 CriticalStrike/Tools/argorder.py
      - name: Check protocol conformances
        run: python3 CriticalStrike/Tools/conformance.py

  build-and-test:
    name: Build and test the core
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app
      - name: Build the core library
        working-directory: CriticalStrike
        run: swift build --target CriticalStrikeCore
      - name: Run the simulation tests
        working-directory: CriticalStrike
        run: swift test

  build-app:
    name: Build the iOS app
    # macos-15, and the image's default Xcode rather than a pinned one: current XcodeGen
    # writes pbxproj object version 77, which Xcode 15.4 refuses to open outright, and
    # XcodeGen has no option to write an older format.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: xcodebuild -version && xcodegen --version || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: CriticalStrike
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: CriticalStrike
        # A generic destination, so the build does not depend on which simulator devices
        # happen to be installed on the image.
        run: |
          xcodebuild build \
            -project CriticalStrike.xcodeproj \
            -scheme CriticalStrike \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
