name: Critical Strike

on:
  push:
    paths:
      - 'CriticalStrike/**'
      - '.github/workflows/criticalstrike.yml'
  pull_request:
    paths:
      - 'CriticalStrike/**'
      - '.github/workflows/criticalstrike.yml'

# A push supersedes the run before it. Without this, a burst of fixes leaves a queue of
# runs against commits nobody cares about, all competing for the same macOS runners.
concurrency:
  group: criticalstrike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Swift sources
        run: python3 CriticalStrike/Tools/validate.py
      - name: Resolve cross-file symbols
        run: python3 CriticalStrike/Tools/symbolcheck.py
      - name: Check initializer argument order
        run: python3 CriticalStrike/Tools/argorder.py
      - name: Check protocol conformances
        run: python3 CriticalStrike/Tools/conformance.py

  build-and-test:
    name: Build and test the core
    runs-on: macos-14
    # The simulation and the audio synthesis both run unoptimised here. If something hangs
    # it should fail in twenty minutes, not sit on a runner until the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app
      - name: Build the core library
        working-directory: CriticalStrike
        run: swift build --target CriticalStrikeCore
      # One step per suite, each with its own deadline. A single `swift test` that hangs
      # says nothing about where; this way the step that stalls names the suite, and every
      # other suite still reports. Output goes through a pty so XCTest line-buffers it —
      # piped, it block-buffers and a slow suite looks exactly like a hung one.
      - name: Test maths
        if: ${{ !cancelled() }}
        working-directory: CriticalStrike
        timeout-minutes: 5
        run: script -q /dev/null swift test --filter "MathTests|NoiseTests|ScalarFieldTests|RGBTests"
      - name: Test audio synthesis
        if: ${{ !cancelled() }}
        working-directory: CriticalStrike
        timeout-minutes: 8
        run: script -q /dev/null swift test --filter "WaveformTests|SynthTests|SoundBankTests"
      - name: Test combat
        if: ${{ !cancelled() }}
        working-directory: CriticalStrike
        timeout-minutes: 5
        run: script -q /dev/null swift test --filter "DamageModelTests|WeaponBalanceTests"
      - name: Test economy and progression
        if: ${{ !cancelled() }}
        working-directory: CriticalStrike
        timeout-minutes: 5
        run: script -q /dev/null swift test --filter "WalletTests|LootCrateTests|ProgressionTests|BattlePassTests|MissionTests|PersistenceTests|ContentIntegrityTests|SocialTests"
      - name: Test netcode
        if: ${{ !cancelled() }}
        working-directory: CriticalStrike
        timeout-minutes: 6
        run: script -q /dev/null swift test --filter "BitStreamTests|ProtocolTests|SnapshotTests|InterpolationBufferTests|LagCompensationTests|AntiCheatTests|TransportTests"
      - name: Test simulation
        if: ${{ !cancelled() }}
        working-directory: CriticalStrike
        timeout-minutes: 8
        run: script -q /dev/null swift test --filter "CollisionTests|MovementTests|WeaponSystemTests|BallisticsTests|MatchFlowTests|MapIntegrityTests"
      - name: Test navigation
        if: ${{ !cancelled() }}
        working-directory: CriticalStrike
        timeout-minutes: 8
        run: script -q /dev/null swift test --filter "NavigationTests"

  build-app:
    name: Build the iOS app
    # macos-15, and the image's default Xcode rather than a pinned one: current XcodeGen
    # writes pbxproj object version 77, which Xcode 15.4 refuses to open outright, and
    # XcodeGen has no option to write an older format.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: xcodebuild -version && xcodegen --version || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: CriticalStrike
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: CriticalStrike
        # A generic destination, so the build does not depend on which simulator devices
        # happen to be installed on the image.
        run: |
          xcodebuild build \
            -project CriticalStrike.xcodeproj \
            -scheme CriticalStrike \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
